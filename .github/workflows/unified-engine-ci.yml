name: K-MATH Unified Engine CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-unification:
    name: Test Python Unification Engine
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          
      - name: Run unification tests
        run: |
          python -m pytest tests/test_unification.py -v --tb=short
      
      - name: Run demo script
        run: |
          PYTHONPATH=$PWD python examples/unification_demo.py
  
  test-lean-proofs:
    name: Verify Lean Formal Proofs
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Lean 4
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      
      - name: Verify Lean version
        run: |
          ~/.elan/bin/lean --version
      
      - name: Build Lean proofs
        run: |
          cd formal
          ~/.elan/bin/lake build
        continue-on-error: true
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install -r crypto/tri_crown/requirements.txt || true
          pip install -r ai/neurosymbolic/requirements.txt || true
      
      - name: Run crypto tests
        run: |
          cd crypto/tri_crown
          python -m pytest test_*.py -v
        continue-on-error: true
      
      - name: Run AI tests  
        run: |
          cd ai/neurosymbolic
          python -m pytest test_*.py -v
        continue-on-error: true
      
      - name: Run unification tests
        run: |
          python -m pytest tests/test_unification.py -v

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Check Python syntax
        run: |
          python -m py_compile core/unification/*.py
          python -m py_compile tests/test_unification.py
          python -m py_compile examples/unification_demo.py
      
      - name: Count test coverage
        run: |
          echo "Test files:"
          find tests -name "test_*.py" | wc -l
          echo "Total test count:"
          grep -r "def test_" tests/ | wc -l
